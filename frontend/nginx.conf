server {
    listen 80;
    server_name localhost;

    # Serve the React static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Handle React Router client-side routing: fallback to index.html
        # for unknown paths so refreshing page on /dashboard doesn't return a 404.
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/ requests to the Django backend service
    # Use "backend:8000" (the docker-compose service name) as the upstream.
    # Note: We omit the trailing slash in proxy_pass so that Nginx passes
    # the matched /api/ prefix along to Django. Django URLs are mapped with /api/.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
