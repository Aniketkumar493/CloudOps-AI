# [![CI/CD](https://github.com/Aniketkumar493/CloudOps-AI/actions/workflows/ci-cd.yml/badge.svg)](https://github.com/Aniketkumar493/CloudOps-AI/actions/workflows/ci-cd.yml)
# ══════════════════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Backend Testing Job ──────────────────────────────────────────────────────
  backend-test:
    name: Backend Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloudops
          POSTGRES_USER: cloudops
          POSTGRES_PASSWORD: cloudops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: cloudops
      DB_USER: cloudops
      DB_PASSWORD: cloudops
      SECRET_KEY: ci-test-secret-key-must-be-long-and-secure
      DJANGO_SETTINGS_MODULE: cloudops_backend.settings.development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # We run flake8 for linting to catch syntax errors and undefined names
      - name: Run Linting (flake8)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django Tests
        run: python manage.py test

  # ── Frontend Build Job ───────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # npm ci is used instead of npm install to ensure clean, reproducible builds
      # based exactly on the package-lock.json file.
      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Production Build
        run: npm run build

  # ── Docker Image Build Job ───────────────────────────────────────────────────
  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    # Why we run lint and tests first (backend-test & frontend-build dependencies):
    # This implements a "Fail Fast" strategy. Building Docker images takes significant
    # time and computational resources. By ensuring that code linting and unit tests
    # pass beforehand, we avoid wasting precious CI/CD runners' execution minutes on
    # builds containing known errors or broken logic.
    needs: [backend-test, frontend-build]
    # This job only runs on push to the main branch to validate final deployment packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # We tag the Docker images using the 7-character truncated git SHA instead of "latest".
      # Why we use Git SHA tagging over "latest":
      # 1. Traceability: Each deployed container image can be directly mapped to the exact
      #    commit in history that generated it.
      # 2. Safe Rollbacks: If a deployment fails, we can roll back immediately to a previous 
      #    known-good image tagged with its respective Git SHA.
      # 3. Immutability: Prevents tag overwriting ("latest" is mutable, which could lead to
      #    inconsistent states across multiple nodes/replicas running different versions of the tag).
      - name: Set Short Git SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Backend Docker Image
        run: docker build -t cloudops-backend:${{ env.SHORT_SHA }} ./backend

      - name: Build Frontend Docker Image
        run: docker build -t cloudops-frontend:${{ env.SHORT_SHA }} ./frontend
