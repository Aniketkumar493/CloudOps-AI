# ══════════════════════════════════════════════════════════════════════════════
# UNDERSTANDING THE TWO LAYERS OF HEALING IN CLOUDOPS-AI:
#
# 1. Kubernetes Infrastructure Self-Healing (Internal Platform Layer):
#    - Target: The CloudOps-AI Django backend application process itself.
#    - Mechanism: Managed by the Kubelet using Liveness and Readiness probes hitting 
#      the HTTP endpoint `GET /api/health/`.
#    - Action: If the Django app crashes, experiences a deadlock, or becomes completely 
#      unresponsive (failing the liveness probe), Kubernetes automatically kills and 
#      recreates the backend container.
#    - Scope: Confined to the internal health of containers running inside this K8s cluster.
#
# 2. Application-Driven EC2 Auto-Healing (External Managed Layer):
#    - Target: Customer EC2 instances registered under management in CloudOps-AI.
#    - Mechanism: Orchestrated by Celery Beat schedules and Django application logic. 
#      It monitors external AWS CloudWatch metrics, evaluates user-defined AlertRules, 
#      and executes remediation policies when an alert fires.
#    - Action: A Celery worker executes a python task calling the AWS SDK (`boto3`) to 
#      trigger a remote action (e.g. `reboot_instances`, `stop_instances`, or ASG scaling) 
#      on the customer's AWS infrastructure.
#    - Scope: Applies to external cloud systems monitored and managed by CloudOps-AI.
# ══════════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cloudops-ai
  labels:
    app: backend
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cloudops-ai
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: run-migrations
        image: cloudops-backend:latest
        command: ["python", "manage.py", "migrate"]
        envFrom:
        - configMapRef:
            name: cloudops-config
        - secretRef:
            name: cloudops-secrets
      containers:
      - name: backend
        image: cloudops-backend:latest
        command: ["gunicorn", "cloudops_backend.wsgi:application", "--bind", "0.0.0.0:8000"]
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: cloudops-config
        - secretRef:
            name: cloudops-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
