apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: cloudops-ai
  labels:
    app: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: cloudops-backend:latest
        command: ["celery", "-A", "cloudops_backend", "worker", "-l", "info"]
        envFrom:
        - configMapRef:
            name: cloudops-config
        - secretRef:
            name: cloudops-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
